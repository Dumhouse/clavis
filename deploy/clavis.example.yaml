# Example Clavis configuration. Every value can be overridden with environment
# variables (see docs/architecture.md); env wins over this file.
server:
  addr: ":8080"
  base_url: "http://localhost:8080"
  dev: false
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 20s
  max_body_bytes: 1048576
  metrics_public: true
  # HTTPS built in. mode: off | self-signed | file | acme
  # Any mode except off needs an https:// base_url; addr then only redirects.
  tls:
    mode: "off"
    addr: ":8443"
    # cert_file: /certs/fullchain.pem   # mode: file
    # key_file: /certs/privkey.pem      # mode: file
    # acme_email: you@example.com       # mode: acme
    # acme_domains: [clavis.example.com]
  # First-run setup presets (optional).
  setup:
    # token: "<at least 24 random characters>"
    # owner_email: you@example.com

database:
  driver: sqlite
  path: "./data/clavis.db"

keys:
  # file: auto-generated 0600 key file (default, good for single-node)
  # env:  base64 32-byte key in root_key_env (or CLAVIS_ROOT_KEY)
  provider: file
  root_key_file: "./data/root.key"
  root_key_env: "CLAVIS_ROOT_KEY"

# Optional scheduled encrypted backups. The root key is required to restore,
# so store it separately from this directory.
backup:
  enabled: false
  dir: "./data/backups"
  interval: 24h
  keep: 7

log:
  level: info
  format: json

security:
  # Syncs, webhooks, SSO discovery and audit exporters never reach private,
  # loopback or link-local addresses. List the ones you do mean to reach, for
  # example a Forgejo or Vault on your LAN. Same as CLAVIS_OUTBOUND_ALLOWLIST.
  outbound_allowlist: []   # e.g. ["192.168.100.0/24"]

# Optional transactional email for password resets and invites.
email:
  enabled: false
  host: "smtp.example.com"
  port: 587
  username: ""
  password: ""
  from: "Clavis <no-reply@example.com>"
  tls: starttls   # starttls | tls | none
