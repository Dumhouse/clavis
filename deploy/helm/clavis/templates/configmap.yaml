apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clavis.fullname" . }}
  labels:
    {{- include "clavis.labels" . | nindent 4 }}
data:
  clavis.yaml: |
    server:
      addr: ":8080"
      base_url: {{ .Values.server.baseURL | quote }}
      dev: {{ .Values.server.dev }}
      metrics_public: {{ .Values.server.metricsPublic }}
      rate_limit_per_minute: {{ .Values.server.rateLimitPerMinute }}
      read_timeout: {{ .Values.server.readTimeout | quote }}
      write_timeout: {{ .Values.server.writeTimeout | quote }}
      idle_timeout: {{ .Values.server.idleTimeout | quote }}
      shutdown_timeout: {{ .Values.server.shutdownTimeout | quote }}
      max_body_bytes: {{ .Values.server.maxBodyBytes }}
    database:
      driver: {{ .Values.database.driver | quote }}
      {{- if eq .Values.database.driver "sqlite" }}
      path: {{ .Values.database.path | quote }}
      {{- end }}
    keys:
      provider: {{ .Values.keys.provider | quote }}
      root_key_file: {{ .Values.keys.rootKeyFile | quote }}
      root_key_env: {{ .Values.keys.rootKeyEnv | quote }}
      {{- if eq .Values.keys.provider "aws-kms" }}
      aws_region: {{ .Values.keys.awsRegion | quote }}
      aws_kms_key_id: {{ .Values.keys.awsKMSKeyID | quote }}
      aws_access_key: {{ .Values.keys.awsAccessKey | quote }}
      aws_kms_endpoint: {{ .Values.keys.awsKMSEndpoint | quote }}
      {{- end }}
      {{- if eq .Values.keys.provider "gcp-kms" }}
      gcp_kms_key: {{ .Values.keys.gcpKMSKey | quote }}
      gcp_service_account_file: "/etc/clavis/gcp-service-account.json"
      gcp_kms_endpoint: {{ .Values.keys.gcpKMSEndpoint | quote }}
      {{- end }}
    log:
      level: {{ .Values.log.level | quote }}
      format: {{ .Values.log.format | quote }}
    email:
      enabled: {{ .Values.email.enabled }}
      host: {{ .Values.email.host | quote }}
      port: {{ .Values.email.port }}
      username: {{ .Values.email.username | quote }}
      from: {{ .Values.email.from | quote }}
      tls: {{ .Values.email.tls | quote }}
    security:
      breach_check: {{ .Values.security.breachCheck }}
      breach_check_url: {{ .Values.security.breachCheckURL | quote }}
      outbound_allowlist: {{ .Values.security.outboundAllowlist | default (list) | toJson }}
    {{- if .Values.auditExporters }}
    audit:
      exporters:
        {{- toYaml .Values.auditExporters | nindent 8 }}
    {{- end }}
