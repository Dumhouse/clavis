apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clavis.fullname" . }}
  labels:
    {{- include "clavis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "clavis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clavis.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "clavis.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: clavis
          image: {{ include "clavis.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server", "--config", "/etc/clavis/clavis.yaml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if and .Values.email.existingSecret .Values.email.enabled }}
            - name: CLAVIS_EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.email.existingSecret }}
                  key: {{ .Values.email.passwordKey }}
            {{- end }}
            {{- if and (eq .Values.keys.provider "env") .Values.keys.existingSecret }}
            - name: {{ .Values.keys.rootKeyEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keys.existingSecret }}
                  key: {{ .Values.keys.secretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/clavis
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "clavis.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "clavis.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
