name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      id-token: write
    # Publishing needs a maintainer's approval in the Actions UI.
    environment: release
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGET_ENABLED: ${{ vars.WINGET_ENABLED }}
      - name: Open the winget pull request
        # Best effort: a token that cannot open a pull request on
        # microsoft/winget-pkgs must not fail a release that is already published.
        if: ${{ vars.WINGET_ENABLED == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "WINGET_TOKEN is not set; skipping the winget pull request."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if ! gh pr create --repo microsoft/winget-pkgs --base master \
            --head "${owner}:clavis-${version}" \
            --title "New version: Dumhouse.Clavis version ${version}" \
            --body "Automated update for Dumhouse.Clavis ${version}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"; then
            echo "::warning::Could not open the winget pull request. The manifest branch clavis-${version} is on ${owner}/winget-pkgs; open the pull request by hand or use a classic token with public_repo as WINGET_TOKEN."
          fi
      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dumhouse/clavis
          short-description: Open-source secrets management for humans, machines, and AI agents.
          readme-filepath: deploy/DOCKERHUB.md
      - name: Publish deb and rpm packages to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          # owner/repository on Cloudsmith; override with a repository variable.
          CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO || 'dumhouse/clavis' }}
        run: |
          if [ -z "$CLOUDSMITH_API_KEY" ]; then
            echo "CLOUDSMITH_API_KEY is not set; skipping Cloudsmith upload."
            exit 0
          fi
          # A private venv: newer Ubuntu runners refuse pip installs into the system
          # Python (PEP 668).
          python3 -m venv "$RUNNER_TEMP/cloudsmith"
          "$RUNNER_TEMP/cloudsmith/bin/pip" install --quiet cloudsmith-cli
          export PATH="$RUNNER_TEMP/cloudsmith/bin:$PATH"
          for f in dist/*.deb; do cloudsmith push deb "$CLOUDSMITH_REPO/any-distro/any-version" "$f" --republish; done
          for f in dist/*.rpm; do cloudsmith push rpm "$CLOUDSMITH_REPO/any-distro/any-version" "$f" --republish; done
      - id: subjects
        run: echo "hashes=$(cd dist && sha256sum *.tar.gz *.zip | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true

  verify:
    name: Verify published release
    needs: [release]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Container images run and are signed
        run: |
          version="${GITHUB_REF_NAME#v}"
          for image in "dumhouse/clavis:${version}" "ghcr.io/dumhouse/clavis:${version}"; do
            docker pull "$image"
            docker run --rm "$image" version
            cosign verify "$image" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          done
      - name: Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for pattern in checksums.txt '_linux_amd64.tar.gz$' '_darwin_arm64.tar.gz$' '_windows_amd64.zip$' '\.deb$' '\.rpm$'; do
            echo "$assets" | grep -Eq "$pattern" || { echo "missing release asset matching $pattern"; exit 1; }
          done
      - name: Homebrew cask and Scoop manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            curl -fsSL https://raw.githubusercontent.com/Dumhouse/homebrew-tap/main/Casks/clavis.rb | grep -q "version \"${version}\"" \
              || { echo "cask does not list ${version}"; exit 1; }
          fi
          if [ -n "${{ secrets.SCOOP_BUCKET_TOKEN }}" ]; then
            curl -fsSL https://raw.githubusercontent.com/Dumhouse/scoop-bucket/main/clavis.json | grep -q "\"version\": \"${version}\"" \
              || { echo "scoop manifest does not list ${version}"; exit 1; }
          fi

  helm:
    name: Publish Helm chart
    needs: [verify]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/helm.yml
    with:
      tag: ${{ github.ref_name }}
