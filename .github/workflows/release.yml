name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-26.04
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGET_ENABLED: ${{ vars.WINGET_ENABLED }}
      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dumhouse/clavis
          short-description: Open-source secrets management for humans, machines, and AI agents.
          readme-filepath: deploy/DOCKERHUB.md
      - name: Publish deb and rpm packages to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          # owner/repository on Cloudsmith; override with a repository variable.
          CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO || 'dumhouse/clavis' }}
        run: |
          if [ -z "$CLOUDSMITH_API_KEY" ]; then
            echo "CLOUDSMITH_API_KEY is not set; skipping Cloudsmith upload."
            exit 0
          fi
          pip install --quiet cloudsmith-cli
          for f in dist/*.deb; do cloudsmith push deb "$CLOUDSMITH_REPO/any-distro/any-version" "$f" --republish; done
          for f in dist/*.rpm; do cloudsmith push rpm "$CLOUDSMITH_REPO/any-distro/any-version" "$f" --republish; done
      - id: subjects
        run: echo "hashes=$(cd dist && sha256sum *.tar.gz *.zip | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true

  verify:
    name: Verify published release
    needs: [release]
    runs-on: ubuntu-26.04
    steps:
      - name: Container images run
        run: |
          version="${GITHUB_REF_NAME#v}"
          for image in "dumhouse/clavis:${version}" "ghcr.io/dumhouse/clavis:${version}"; do
            docker pull "$image"
            docker run --rm "$image" version
          done
      - name: Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for pattern in checksums.txt '_linux_amd64.tar.gz$' '_darwin_arm64.tar.gz$' '_windows_amd64.zip$' '\.deb$' '\.rpm$'; do
            echo "$assets" | grep -Eq "$pattern" || { echo "missing release asset matching $pattern"; exit 1; }
          done
      - name: Homebrew cask and Scoop manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            curl -fsSL https://raw.githubusercontent.com/Dumhouse/homebrew-tap/main/Casks/clavis.rb | grep -q "version \"${version}\"" \
              || { echo "cask does not list ${version}"; exit 1; }
          fi
          if [ -n "${{ secrets.SCOOP_BUCKET_TOKEN }}" ]; then
            curl -fsSL https://raw.githubusercontent.com/Dumhouse/scoop-bucket/main/clavis.json | grep -q "\"version\": \"${version}\"" \
              || { echo "scoop manifest does not list ${version}"; exit 1; }
          fi
