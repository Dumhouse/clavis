name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # The codegen tests compile the generated loader with `cargo check`.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0

  macos:
    name: macOS terminal tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # `clavis run` opens a pseudo-terminal differently on macOS than on
      # Linux, so run the terminal and masking tests there too.
      - run: go test -count=1 -run 'PTY|Mask|Doctor' ./internal/cli

  windows:
    name: Windows terminal tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # clavis run uses a Windows pseudo console (ConPTY) for consoles.
      - run: go test -count=1 -run 'PTY|Mask' ./internal/cli

  postgres:
    name: Go tests (Postgres)
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clavis
          POSTGRES_PASSWORD: clavis
          POSTGRES_DB: clavis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clavis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLAVIS_TEST_POSTGRES: postgres://clavis:clavis@localhost:5432/clavis_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/server ./internal/cli ./internal/jobs ./internal/store

  mysql:
    name: Go tests (MySQL)
    runs-on: ubuntu-26.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: clavis
          MYSQL_DATABASE: clavis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pclavis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLAVIS_TEST_MYSQL: root:clavis@tcp(127.0.0.1:3306)/clavis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/service -run MySQL -count=1 -v

  operator:
    name: Kubernetes operator
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operator/go.mod
          cache: true
          cache-dependency-path: operator/go.sum
      - run: go test ./...
        working-directory: operator
      - run: go build ./...
        working-directory: operator

  csi:
    name: CSI driver
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: csi/go.mod
          cache: true
          cache-dependency-path: csi/go.sum
      - run: go test ./...
        working-directory: csi
      - run: go build ./...
        working-directory: csi

  helm:
    name: Helm chart
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Lint and render
        run: |
          chart=deploy/helm/clavis
          helm lint "$chart"
          helm template clavis "$chart" > /dev/null
          helm template clavis "$chart" \
            --set database.driver=postgres,database.existingSecret=clavis-postgres,replicaCount=2 > /dev/null
          if helm template clavis "$chart" --set replicaCount=2 > /dev/null 2>&1; then
            echo "::error::SQLite with replicaCount=2 must be rejected"
            exit 1
          fi
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      - name: Install into kind
        # Installs this chart with the latest released server image, so a
        # chart change that breaks a real deployment fails here, not at release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          helm install clavis deploy/helm/clavis \
            --namespace clavis --create-namespace \
            --set image.tag="${tag#v}" \
            --set persistence.size=1Gi \
            --wait --timeout 5m
          kubectl -n clavis port-forward svc/clavis 8080:8080 &
          for _ in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8080/readyz && exit 0
            sleep 2
          done
          exit 1
      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl -n clavis get all,pvc
          kubectl -n clavis describe pods
          kubectl -n clavis logs -l app.kubernetes.io/name=clavis --tail=200 --all-containers

  docs:
    name: Docs site
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm build
        working-directory: docs

  web:
    name: Web
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web check:contrast
      - run: pnpm --dir web check:hints
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web check:bundle
      # The binary job embeds this build instead of repeating the install and build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  sdk:
    name: SDKs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm test
        working-directory: sdk/node
      - run: npm pack --dry-run
        working-directory: sdk/node
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest -v test_clavis_client
        working-directory: sdk/python
      - run: python -m pip install build && python -m build
        working-directory: sdk/python
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1
        with:
          ruby-version: "3.1"
      - run: ruby -I. test_clavis_client.rb
        working-directory: sdk/ruby

  build:
    name: Build binary
    needs: [go, web]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: web/dist/
      - run: CGO_ENABLED=0 go build -trimpath -o bin/clavis ./cmd/clavis
      - run: ./bin/clavis version --json

  cli-e2e:
    name: CLI against a real server
    needs: [go]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 go build -trimpath -o bin/clavis ./cmd/clavis
      - run: ./scripts/cli-e2e.sh bin/clavis

  docker:
    name: Docker image and update script
    needs: [go]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: ./scripts/check-dockerfiles.sh
      - run: CGO_ENABLED=0 go build -trimpath -o bin/clavis ./cmd/clavis
      - run: ./scripts/docker-smoke.sh bin/clavis

  e2e:
    name: E2E (Playwright)
    needs: [go, web]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --dir web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --dir web exec playwright install-deps chromium
      - run: pnpm --dir web e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
