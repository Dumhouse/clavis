name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  postgres:
    name: Go tests (Postgres)
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clavis
          POSTGRES_PASSWORD: clavis
          POSTGRES_DB: clavis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clavis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLAVIS_TEST_POSTGRES: postgres://clavis:clavis@localhost:5432/clavis_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/server ./internal/cli ./internal/jobs ./internal/store

  operator:
    name: Kubernetes operator
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache: true
          cache-dependency-path: operator/go.sum
      - run: go test ./...
        working-directory: operator
      - run: go build ./...
        working-directory: operator

  csi:
    name: CSI driver
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: csi/go.mod
          cache: true
          cache-dependency-path: csi/go.sum
      - run: go test ./...
        working-directory: csi
      - run: go build ./...
        working-directory: csi

  helm:
    name: Helm chart
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          chart=deploy/helm/clavis
          helm lint "$chart"
          helm template clavis "$chart" > /dev/null
          helm template clavis "$chart" \
            --set database.driver=postgres,database.existingSecret=clavis-postgres,replicaCount=2 > /dev/null
          if helm template clavis "$chart" --set replicaCount=2 > /dev/null 2>&1; then
            echo "::error::SQLite with replicaCount=2 must be rejected"
            exit 1
          fi
      - uses: helm/kind-action@v1
      - name: Install into kind
        # Installs this chart with the latest released server image, so a
        # chart change that breaks a real deployment fails here, not at release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          helm install clavis deploy/helm/clavis \
            --namespace clavis --create-namespace \
            --set image.tag="${tag#v}" \
            --set persistence.size=1Gi \
            --wait --timeout 5m
          kubectl -n clavis port-forward svc/clavis 8080:8080 &
          for _ in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8080/readyz && exit 0
            sleep 2
          done
          exit 1
      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl -n clavis get all,pvc
          kubectl -n clavis describe pods
          kubectl -n clavis logs -l app.kubernetes.io/name=clavis --tail=200 --all-containers

  docs:
    name: Docs site
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm build
        working-directory: docs

  web:
    name: Web
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web check:contrast
      - run: pnpm --dir web check:hints
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web check:bundle
      # The binary job embeds this build instead of repeating the install and build.
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build:
    name: Build binary
    needs: [go, web]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      - run: CGO_ENABLED=0 go build -trimpath -o bin/clavis ./cmd/clavis
      - run: ./bin/clavis version --json

  e2e:
    name: E2E (Playwright)
    needs: [go, web]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --dir web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --dir web exec playwright install-deps chromium
      - run: pnpm --dir web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
