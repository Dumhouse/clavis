name: Helm chart

# Publishes the chart as an OCI artifact to ghcr.io, which Artifact Hub can
# index. Pages already serves the docs site, so a classic index.yaml repo would
# need a second site; OCI avoids that.
#
# The release workflow calls this after the release is verified. A release
# created with GITHUB_TOKEN never fires a `release: published` trigger, which
# is why this used to be a workflow that never ran. Run it by hand from the
# Actions tab to publish the chart outside a release.
#
# A release publishes the chart with the release's version as both the chart
# version and appVersion, so `--version 0.3.0` always means Clavis 0.3.0 and
# a later release never overwrites an earlier chart. Without a version input,
# the version and appVersion in Chart.yaml are used as they are.
on:
  workflow_call:
    inputs:
      version:
        description: "Release tag (v0.3.0) or version; becomes the chart version and appVersion"
        type: string
        default: ""
      ref:
        description: "Git ref to package the chart from; empty uses the ref that triggered the run"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (v0.3.0) or version; empty uses the versions in Chart.yaml"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/clavis
      - name: Package
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          if [ -z "${version}" ]; then
            version="$(sed -n 's/^version: *//p' deploy/helm/clavis/Chart.yaml | tr -d '"')"
            helm package deploy/helm/clavis --destination dist
          else
            helm package deploy/helm/clavis --destination dist --version "${version}" --app-version "${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Push
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ steps.package.outputs.version }}
        run: |
          echo "${GH_TOKEN}" | helm registry login ghcr.io -u "${GH_ACTOR}" --password-stdin
          helm push "dist/clavis-${CHART_VERSION}.tgz" oci://ghcr.io/dumhouse/charts
          helm registry logout ghcr.io
      - name: Anonymous install works
        # A new ghcr.io package is private. The chart is only useful when
        # anyone can pull it, so fail loudly until its visibility is Public.
        # Retries cover the short delay before a fresh push is pullable.
        env:
          CHART_VERSION: ${{ steps.package.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if helm pull oci://ghcr.io/dumhouse/charts/clavis --version "${CHART_VERSION}" --destination "$(mktemp -d)"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Chart ${CHART_VERSION} was pushed but cannot be pulled anonymously. Make the package public: https://github.com/orgs/Dumhouse/packages/container/charts%2Fclavis/settings (Danger zone, Change visibility)."
          exit 1
