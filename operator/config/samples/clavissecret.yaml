apiVersion: clavis.dumhouse.github.io/v1alpha1
kind: ClavisSecret
metadata:
  name: web-app-dev
  namespace: default
spec:
  server: https://clavis.example.com
  org: acme
  project: web-app
  environment: dev
  secretName: web-app-dev
  tokenSecretRef:
    name: clavis-token
    key: token
  refreshInterval: 5m
  restartDeployments:
    - web-app
  keys:
    - DATABASE_URL
    - STRIPE_KEY
