apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clavissecrets.clavis.dumhouse.github.io
spec:
  group: clavis.dumhouse.github.io
  scope: Namespaced
  names:
    plural: clavissecrets
    singular: clavissecret
    kind: ClavisSecret
    shortNames: [cvs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Keys
          type: integer
          jsonPath: .status.keyCount
        - name: Last sync
          type: date
          jsonPath: .status.lastSync
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [server, org, project, environment, tokenSecretRef]
              properties:
                server: {type: string}
                org: {type: string}
                project: {type: string}
                environment: {type: string}
                secretName: {type: string}
                refreshInterval:
                  type: string
                tokenSecretRef:
                  type: object
                  required: [name, key]
                  properties:
                    name: {type: string}
                    key: {type: string}
                restartDeployments:
                  type: array
                  items: {type: string}
                keys:
                  type: array
                  items: {type: string}
            status:
              type: object
              properties:
                lastSync: {type: string, format: date-time}
                hash: {type: string}
                keyCount: {type: integer}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
