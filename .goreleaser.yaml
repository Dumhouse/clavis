version: 2

project_name: clavis

before:
  hooks:
    - go mod tidy

builds:
  - id: clavis
    main: ./cmd/clavis
    binary: clavis
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dumhouse/clavis/internal/version.Version={{ .Version }}
      - -X github.com/dumhouse/clavis/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/dumhouse/clavis/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - deploy/clavis.example.yaml

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  # Sign each archive and the checksum file. Packages and SBOMs are covered by
  # the signed checksums.txt, which keeps the release page short.
  - id: archives
    cmd: cosign
    artifacts: archive
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
  - id: checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

dockers_v2:
  - id: clavis
    dockerfile: deploy/Dockerfile.goreleaser
    images:
      - ghcr.io/dumhouse/clavis
      - docker.io/dumhouse/clavis
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: https://github.com/Dumhouse/clavis
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.title: Clavis
      org.opencontainers.image.description: Open-source secrets management for humans, machines, and AI agents.
      org.opencontainers.image.url: https://dumhouse.github.io/clavis/
      org.opencontainers.image.documentation: https://dumhouse.github.io/clavis/quickstart
      org.opencontainers.image.vendor: Dumhouse

homebrew_casks:
  - name: clavis
    repository:
      owner: dumhouse
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: https://dumhouse.github.io/clavis/
    description: Open-source secrets management for humans, machines, and AI agents.
    # Skipped until the HOMEBREW_TAP_TOKEN secret exists, so releases keep working.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    # The binary is not notarized by Apple, so clear the download quarantine flag.
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/clavis"]

scoops:
  - name: clavis
    repository:
      owner: dumhouse
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_TOKEN }}'
    homepage: https://dumhouse.github.io/clavis/
    description: Open-source secrets management for humans, machines, and AI agents.
    license: Apache-2.0
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_TOKEN" }}false{{ else }}true{{ end }}'

winget:
  - name: clavis
    publisher: Dumhouse
    package_identifier: Dumhouse.Clavis
    short_description: Open-source secrets management for humans, machines, and AI agents.
    description: >-
      Clavis is a self-hosted secrets manager in a single Go binary: typed config,
      dynamic credentials, time-limited access with approvals, an audit log, and an
      MCP server that lets coding agents run commands without seeing secret values.
    publisher_url: https://github.com/Dumhouse
    publisher_support_url: https://github.com/Dumhouse/clavis/issues
    homepage: https://dumhouse.github.io/clavis/
    license: Apache-2.0
    license_url: https://github.com/Dumhouse/clavis/blob/main/LICENSE
    release_notes_url: https://github.com/Dumhouse/clavis/releases/tag/{{ .Tag }}
    tags:
      - secrets
      - secrets-management
      - security
      - devops
      - cli
    # Off until WINGET_ENABLED is "true" and WINGET_TOKEN exists. A failure here
    # (for example a token that cannot open a pull request on microsoft/winget-pkgs)
    # would otherwise fail the whole release before the later steps run.
    skip_upload: '{{ if and (index .Env "WINGET_TOKEN") (eq (index .Env "WINGET_ENABLED") "true") }}false{{ else }}true{{ end }}'
    repository:
      owner: dumhouse
      name: winget-pkgs
      branch: 'clavis-{{ .Version }}'
      token: '{{ .Env.WINGET_TOKEN }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

nfpms:
  - id: packages
    package_name: clavis
    vendor: Dumhouse
    homepage: https://dumhouse.github.io/clavis/
    maintainer: Dumhouse <noreply@users.noreply.github.com>
    description: Open-source secrets management for humans, machines, and AI agents.
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

release:
  header: |
    ## Clavis {{ .Version }}

    Open-source secrets management for humans, machines, and AI agents.

    **Install**

    - macOS: `brew install dumhouse/tap/clavis`
    - Windows: `scoop bucket add dumhouse https://github.com/Dumhouse/scoop-bucket && scoop install clavis`
    - Any Linux or macOS: `curl -fsSL https://raw.githubusercontent.com/dumhouse/clavis/main/scripts/install.sh | bash`
    - Docker: `docker run -p 8080:8080 -v clavis-data:/data dumhouse/clavis:{{ .Version }}`
  footer: |
    **Which file do I need?** One archive or package for your platform. The `.sigstore.json`, `.sbom.json` and `multiple.intoto.jsonl` files let you verify it; see the [supply chain docs](https://dumhouse.github.io/clavis/supply-chain).

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
