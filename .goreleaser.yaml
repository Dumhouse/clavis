version: 2

project_name: clavis

before:
  hooks:
    - go mod tidy

builds:
  - id: clavis
    main: ./cmd/clavis
    binary: clavis
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dumhouse/clavis/internal/version.Version={{ .Version }}
      - -X github.com/dumhouse/clavis/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/dumhouse/clavis/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - deploy/clavis.example.yaml

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: all
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

dockers_v2:
  - id: clavis
    dockerfile: deploy/Dockerfile.goreleaser
    images:
      - ghcr.io/dumhouse/clavis
      - docker.io/dumhouse/clavis
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: https://github.com/Dumhouse/clavis
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.title: Clavis
      org.opencontainers.image.description: Open-source secrets management for humans, machines, and AI agents.
      org.opencontainers.image.url: https://dumhouse.github.io/clavis/
      org.opencontainers.image.documentation: https://dumhouse.github.io/clavis/quickstart
      org.opencontainers.image.vendor: Dumhouse

homebrew_casks:
  - name: clavis
    repository:
      owner: dumhouse
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    homepage: https://dumhouse.github.io/clavis/
    description: Open-source secrets management for humans, machines, and AI agents.
    # Skipped until the HOMEBREW_TAP_TOKEN secret exists, so releases keep working.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    # The binary is not notarized by Apple, so clear the download quarantine flag.
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/clavis"]

scoops:
  - name: clavis
    repository:
      owner: dumhouse
      name: scoop-bucket
      token: '{{ index .Env "SCOOP_BUCKET_TOKEN" }}'
    homepage: https://dumhouse.github.io/clavis/
    description: Open-source secrets management for humans, machines, and AI agents.
    license: Apache-2.0
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_TOKEN" }}false{{ else }}true{{ end }}'

nfpms:
  - id: packages
    package_name: clavis
    vendor: Dumhouse
    homepage: https://dumhouse.github.io/clavis/
    maintainer: Dumhouse <noreply@users.noreply.github.com>
    description: Open-source secrets management for humans, machines, and AI agents.
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

release:
  header: |
    ## Clavis {{ .Version }}

    Open-source secrets management for humans, machines, and AI agents.

    **Install**

    - macOS: `brew install dumhouse/tap/clavis`
    - Windows: `scoop bucket add dumhouse https://github.com/Dumhouse/scoop-bucket && scoop install clavis`
    - Any Linux or macOS: `curl -fsSL https://raw.githubusercontent.com/dumhouse/clavis/main/scripts/install.sh | bash`
    - Docker: `docker run -p 8080:8080 -v clavis-data:/data dumhouse/clavis:{{ .Version }}`
  footer: |
    **Which file do I need?** One archive or package for your platform. The `.sigstore.json`, `.sbom.json` and `multiple.intoto.jsonl` files let you verify it; see the [supply chain docs](https://dumhouse.github.io/clavis/supply-chain).

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
