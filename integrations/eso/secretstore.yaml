apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: clavis
  namespace: default
spec:
  provider:
    webhook:
      url: https://clavis.example.com/api/v1/orgs/acme/projects/web-app/environments/dev/secrets:eso
      method: GET
      result:
        jsonPath: "$"
      headers:
        Authorization: Bearer {{ .auth.token }}
      secrets:
        - name: auth
          secretRef:
            name: clavis-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-app-dev
  namespace: default
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: clavis
    kind: SecretStore
  target:
    name: web-app-dev
  dataFrom:
    - extract:
        key: dev
