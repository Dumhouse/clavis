name: Clavis
description: Sign in to Clavis with GitHub Actions OIDC and optionally export secrets
author: Clavis

inputs:
  server:
    description: Clavis server URL
    required: true
  org:
    description: Organization slug
    required: true
  identity:
    description: Workload identity name configured with GitHub OIDC trust
    required: true
  audience:
    description: OIDC audience requested from GitHub
    required: false
    default: clavis
  token:
    description: Optional static Clavis token (skips OIDC)
    required: false
    default: ""
  export:
    description: Export secrets into GITHUB_ENV (requires the clavis CLI)
    required: false
    default: "false"
  export-env:
    description: Environment slug used for export
    required: false
    default: ""
  export-project:
    description: Project slug used for export
    required: false
    default: ""

outputs:
  token:
    description: Short-lived Clavis token
    value: ${{ steps.auth.outputs.token }}
  expires-at:
    description: Token expiry timestamp
    value: ${{ steps.auth.outputs.expires-at }}
  secrets-json:
    description: Exported secrets as JSON when export is enabled
    value: ${{ steps.export.outputs.secrets-json }}

runs:
  using: composite
  steps:
    - id: auth
      shell: bash
      env:
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_IDENTITY: ${{ inputs.identity }}
        INPUT_AUDIENCE: ${{ inputs.audience }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        server="${INPUT_SERVER%/}"
        token="${INPUT_TOKEN}"
        expires=""

        if [ -z "$token" ]; then
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC is unavailable. Add 'permissions: id-token: write' to the job."
            exit 1
          fi
          oidc_response="$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${INPUT_AUDIENCE}")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -r '.value // empty')"
          if [ -z "$oidc_token" ]; then
            echo "::error::GitHub did not return an OIDC token."
            printf '%s\n' "$oidc_response" >&2
            exit 1
          fi
          payload="$(jq -nc --arg org "$INPUT_ORG" --arg identity "$INPUT_IDENTITY" --arg token "$oidc_token" \
            '{org: $org, identity: $identity, token: $token}')"
          exchange="$(curl -sS -X POST "${server}/api/v1/auth/oidc" \
            -H 'Content-Type: application/json' \
            -d "$payload")"
          token="$(printf '%s' "$exchange" | jq -r '.token // empty')"
          expires="$(printf '%s' "$exchange" | jq -r '.expires_at // empty')"
          if [ -z "$token" ]; then
            echo "::error::Clavis rejected the OIDC exchange."
            printf '%s\n' "$exchange" >&2
            exit 1
          fi
        fi

        echo "::add-mask::$token"
        {
          echo "CLAVIS_SERVER=$server"
          echo "CLAVIS_ORG=$INPUT_ORG"
          echo "CLAVIS_TOKEN=$token"
        } >> "$GITHUB_ENV"
        {
          echo "token=$token"
          echo "expires-at=$expires"
        } >> "$GITHUB_OUTPUT"

    - id: export
      if: ${{ inputs.export == 'true' }}
      shell: bash
      env:
        CLAVIS_SERVER: ${{ inputs.server }}
        CLAVIS_ORG: ${{ inputs.org }}
        CLAVIS_PROJECT: ${{ inputs.export-project }}
        CLAVIS_ENV: ${{ inputs.export-env }}
        CLAVIS_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        set -euo pipefail
        if ! command -v clavis >/dev/null 2>&1; then
          echo "::error::The clavis CLI is not installed on this runner."
          exit 1
        fi
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq is required for export."
          exit 1
        fi
        json="$(clavis export --format json)"
        while IFS= read -r line; do
          value="${line#*=}"
          if [[ "$value" == *$'\n'* ]]; then
            echo "::warning::Skipping multiline secret ${line%%=*}; use clavis run instead."
            continue
          fi
          echo "::add-mask::$value"
          printf '%s\n' "$line" >> "$GITHUB_ENV"
        done < <(printf '%s' "$json" | jq -r 'to_entries[] | "\(.key)=\(.value)"')
        {
          echo 'secrets-json<<CLAVIS_SECRETS_EOF'
          printf '%s\n' "$json"
          echo 'CLAVIS_SECRETS_EOF'
        } >> "$GITHUB_OUTPUT"
