name: Clavis secrets
description: Load secrets from a Clavis environment into the job. Works on GitHub, Forgejo and Gitea Actions.
author: Dumhouse

branding:
  icon: lock
  color: green

inputs:
  server:
    description: Clavis server URL, for example https://clavis.example.com
    required: true
  token:
    description: Machine token (store it as a CI secret). Leave empty to sign in with GitHub OIDC instead.
    required: false
    default: ""
  environment:
    description: Environment to load, for example staging or production. Empty means only sign in.
    required: false
    default: ""
  project:
    description: Project slug. Defaults to the one in the committed .clavis.yaml.
    required: false
    default: ""
  org:
    description: Organization slug. Defaults to .clavis.yaml or the token's organization; required for OIDC.
    required: false
    default: ""
  server-fingerprint:
    description: SHA-256 of a self-signed server certificate (clavis admin tls-info prints it)
    required: false
    default: ""
  ca-cert:
    description: Your own CA, as a file path or PEM text
    required: false
    default: ""
  version:
    description: CLI version to install, like 0.3.2, or latest
    required: false
    default: latest
  install:
    description: auto (install when clavis is not on PATH), true, or false
    required: false
    default: auto
  download-base:
    description: Where releases are downloaded from (a mirror, for runners without GitHub access)
    required: false
    default: https://github.com/dumhouse/clavis/releases
  identity:
    description: Workload identity for GitHub OIDC sign-in
    required: false
    default: ""
  audience:
    description: OIDC audience requested from GitHub
    required: false
    default: clavis
  # Older names, still accepted.
  export:
    description: Deprecated; set environment instead
    required: false
    default: "false"
  export-env:
    description: Deprecated; use environment
    required: false
    default: ""
  export-project:
    description: Deprecated; use project
    required: false
    default: ""

outputs:
  token:
    description: The Clavis token for later steps (masked)
    value: ${{ steps.auth.outputs.token }}
  expires-at:
    description: Expiry of an OIDC token; empty for machine tokens
    value: ${{ steps.auth.outputs.expires-at }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        CLAVIS_VERSION: ${{ inputs.version }}
        CLAVIS_INSTALL: ${{ inputs.install }}
        CLAVIS_DOWNLOAD_BASE: ${{ inputs.download-base }}
      run: bash "${{ github.action_path }}/install.sh"

    - id: auth
      shell: bash
      env:
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_PROJECT: ${{ inputs.project || inputs.export-project }}
        INPUT_ENVIRONMENT: ${{ inputs.environment || inputs.export-env }}
        INPUT_IDENTITY: ${{ inputs.identity }}
        INPUT_AUDIENCE: ${{ inputs.audience }}
        INPUT_SERVER_FINGERPRINT: ${{ inputs.server-fingerprint }}
        INPUT_CA_CERT: ${{ inputs.ca-cert }}
      run: bash "${{ github.action_path }}/auth.sh"

    - id: export
      if: ${{ inputs.environment != '' || inputs.export == 'true' }}
      shell: bash
      env:
        CLAVIS_BIN: ${{ steps.install.outputs.bin }}
        CLAVIS_SERVER: ${{ inputs.server }}
        CLAVIS_TOKEN: ${{ steps.auth.outputs.token }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_PROJECT: ${{ inputs.project || inputs.export-project }}
        INPUT_ENVIRONMENT: ${{ inputs.environment || inputs.export-env }}
        CLAVIS_SERVER_FINGERPRINT: ${{ inputs.server-fingerprint }}
        INPUT_CA_CERT: ${{ inputs.ca-cert }}
      run: bash "${{ github.action_path }}/export.sh"
