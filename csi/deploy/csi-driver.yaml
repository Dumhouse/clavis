apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: clavis.csi.dumhouse.github.io
spec:
  attachRequired: false
  podInfoOnMount: false
  volumeLifecycleModes: [Persistent]
---
apiVersion: v1
kind: Namespace
metadata:
  name: clavis-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: clavis-csi
  namespace: clavis-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clavis-csi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clavis-csi
    spec:
      serviceAccountName: clavis-csi
      containers:
        - name: csi
          image: ghcr.io/dumhouse/clavis-csi:latest
          args: ["--endpoint=/csi/csi.sock"]
          env:
            - name: CLAVIS_SERVER
              value: https://clavis.example.com
            - name: CLAVIS_ORG
              value: acme
            - name: CLAVIS_PROJECT
              value: web-app
            - name: CLAVIS_ENV
              value: dev
            - name: CLAVIS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clavis-csi-token
                  key: token
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
          securityContext:
            privileged: true
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/clavis.csi.dumhouse.github.io
            type: DirectoryOrCreate
        - name: pods-mount
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clavis-csi
  namespace: clavis-system
