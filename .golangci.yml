version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - usestdlibvars
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
