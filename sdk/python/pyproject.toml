[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clavis-client"
# The publish workflow sets this from the release tag.
version = "0.0.0"
description = "A tiny Clavis client: fetch an environment's secrets at start-up."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["secrets", "clavis", "environment", "config"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://dumhouse.github.io/clavis/guides/sdks"
Source = "https://github.com/Dumhouse/clavis/tree/main/sdk/python"

[tool.setuptools]
py-modules = ["clavis_client"]
