<text class="v0" x="22" y="67" fill="#71717a"># sign in once and link the repo</text><g class="v1"><text x="22" y="89" fill="#34d399">$</text><text x="38.86" y="89" fill="#f4f4f5" clip-path="url(#c1)">clavis login</text></g><text class="v2" x="22" y="111" fill="#6ee7b7">✓ Signed in as ada@acme.dev (token stored in OS keychain)</text><g class="v3"><text x="22" y="133" fill="#34d399">$</text><text x="38.86" y="133" fill="#f4f4f5" clip-path="url(#c3)">clavis link --project web-app --env development</text></g><text class="v4" x="22" y="155" fill="#6ee7b7">✓ Wrote .clavis.yaml</text><text class="v5" x="22" y="177" fill="#71717a"># run with secrets injected; output is masked</text><g class="v6"><text x="22" y="199" fill="#34d399">$</text><text x="38.86" y="199" fill="#f4f4f5" clip-path="url(#c6)">clavis run -- pnpm dev</text></g><text class="v7" x="22" y="221" fill="#a1a1aa">  ready  DATABASE_URL=postgres://app:******@db:5432/app</text><text class="v8" x="22" y="243" fill="#a1a1aa">  ready  STRIPE_SECRET_KEY=******</text><text class="v9" x="22" y="265" fill="#71717a"># typed config fails CI before bad values ship</text><g class="v10"><text x="22" y="287" fill="#34d399">$</text><text x="38.86" y="287" fill="#f4f4f5" clip-path="url(#c10)">clavis check --env production</text></g><text class="v11" x="22" y="309" fill="#fca5a5">✕ SENTRY_DSN  required in production, missing</text><text class="v12" x="22" y="331" fill="#71717a"># agents run allowlisted commands, never see values</text><g class="v13"><text x="22" y="353" fill="#34d399">$</text><text x="38.86" y="353" fill="#f4f4f5" clip-path="url(#c13)">clavis agents allow claude-code &quot;pnpm test&quot;</text></g><text class="v14" x="22" y="375" fill="#6ee7b7">✓ claude-code may run: pnpm test</text>
